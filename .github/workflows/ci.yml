name: ci

# Cada push y cada PR a main, staging y corte queda en verde o rojo en GitHub, con lo MISMO que
# corre el build de Netlify (netlify.toml: `npm run test:gate && node scripts/build-minify.mjs`).
# 25/09: e32e5355 dejó corte en rojo con un tope calibrado sobre el árbol compartido y nadie lo
# vio hasta revisarlo a mano; esto lo caza una máquina.
# (El job «smoke» de antes corría `npm test` completo contra el proyecto VIEJO, tsdpbq…: fuera.)
on:
  push:
    branches: [main, staging, corte]
  pull_request:
    branches: [main, staging, corte]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: test:gate (el de Netlify)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 (LTS): @supabase/supabase-js requiere WebSocket global.
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # Los tests contra la base viva (endpoints/rls/rpcs) quedan fuera, igual que en Netlify.
      - name: test:gate
        run: npm run test:gate

  lint:
    name: eslint (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # Ratchet: la deuda existente son warnings con tope fijo (--max-warnings en lint:ci).
      # Si un cambio AGREGA violaciones, el job falla. Los errores siempre bloquean.
      - name: Lint
        run: npm run lint:ci

  build:
    name: build-minify (el de Netlify)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # build-minify no corta el build si un archivo no se puede minificar (lo deja como estaba);
      # aquí sí es fallo: quiere decir que esbuild no pudo leer ese archivo.
      - name: build-minify
        run: |
          node scripts/build-minify.mjs 2>&1 | tee build.log
          if grep -q "sin minificar" build.log; then echo "::error::hay archivos que esbuild no pudo leer"; exit 1; fi
