    <style>
        /* Critical CSS: evita FOUC (flash blanco) mientras carga bundle.css.
           Solo lo absolutamente necesario para el primer paint coherente:
           fondo oscuro, tipografía, layout de modales portal. */
        :root {
            color-scheme: dark;
        }
        html, body {
            margin: 0;
            padding: 0;
            /* Negro puro: = --bg-base de bundle.css. Literal porque este CSS crítico
               pinta antes de que cargue el bundle (y con él los tokens). */
            background: #000;
            color: #D4D1D8;
            font-family: 'Spline Sans', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body {
            min-height: 100vh;
            overflow-x: hidden;
        }
        #app-container, #navigation-container {
            background: #000; /* = --bg-base */
        }
        /* ===== Splash de arranque =====
           Cubre TODO (header + contenido + barra de progreso) mientras la app
           resuelve sesión y ruta. Evita ver el header a medio pintar, el
           "Redirigiendo..." y el fondo dinámico sin cargar. Vive en el critical
           CSS para que anime desde la primera pintura, antes de bundle.css. */
        #app-splash {
            position: fixed;
            inset: 0;
            z-index: 5000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000; /* = --bg-base (negro puro; literal: pinta antes del bundle) */
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        #app-splash.app-splash--hide {
            opacity: 0;
            pointer-events: none;
        }
        /* Fondo "astral": rayos de luz refractada (el espectro de AI Smart Content)
           cayendo en camara lenta hacia un punto de fuga central, con la misma
           gravedad que el Starfield de /plans. Canvas dibujado por el script de
           abajo del <body>; aqui solo su caja. */
        #app-splash .app-splash-rays {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            animation: appSplashFadeIn 1.4s ease 0.1s forwards;
        }
        /* Halo tenue detras del logo: el "pozo" hacia donde cae la luz. */
        #app-splash::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(520px, 90vw);
            height: min(520px, 90vw);
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(closest-side, rgba(140, 120, 255, 0.10), rgba(0, 231, 255, 0.04) 45%, transparent 75%);
            pointer-events: none;
        }
        #app-splash .app-splash-logo {
            position: relative;
            z-index: 1;
            width: min(280px, 56vw);
            height: auto;
            opacity: 0;
            transform: translateY(8px) scale(0.985);
            animation:
                appSplashLogoIn 0.9s cubic-bezier(0.22, 0.61, 0.36, 1) forwards,
                appSplashFloat 6s ease-in-out 0.9s infinite;
        }
        @keyframes appSplashLogoIn {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        /* Flotar: sube y baja 6px, lento, como suspendido en el vacio. */
        @keyframes appSplashFloat {
            0%, 100% { opacity: 1; transform: translateY(0); }
            50%      { opacity: 1; transform: translateY(-6px); }
        }
        @keyframes appSplashFadeIn {
            to { opacity: 1; }
        }
        @media (prefers-reduced-motion: reduce) {
            #app-splash .app-splash-logo { animation: none; opacity: 1; transform: none; }
            #app-splash .app-splash-rays { animation: none; opacity: 1; }
        }
        #modals-portal {
            position: fixed;
            inset: 0;
            z-index: 2000;
            pointer-events: none;
        }
        #modals-portal > .modal {
            pointer-events: auto;
        }
        /* Skip link: oculto fuera del viewport hasta recibir focus. */
        .skip-to-content {
            position: fixed;
            top: 8px;
            left: 8px;
            z-index: 3000;
            padding: 8px 16px;
            background: #141517;
            color: #D4D1D8;
            border: 1px solid #242424;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.875rem;
            transform: translateY(-200%);
            transition: transform 180ms cubic-bezier(0.33, 0, 0.2, 1);
        }
        .skip-to-content:focus {
            transform: translateY(0);
            outline: 2px solid rgba(255, 255, 255, 0.35);
            outline-offset: 2px;
        }
        /* Toast: contenedor + items. aria-live ya en el container vía JS. */
        .toast-container {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 3500;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            max-width: 360px;
        }
        .toast {
            pointer-events: auto;
            padding: 12px 16px;
            background: #141517;
            color: #D4D1D8;
            border: 1px solid #242424;
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
            font-size: 0.875rem;
            line-height: 1.4;
            cursor: pointer;
            opacity: 0;
            transform: translateX(20px);
            transition: opacity 200ms cubic-bezier(0.33, 0, 0.2, 1),
                        transform 200ms cubic-bezier(0.33, 0, 0.2, 1);
        }
        .toast--enter { opacity: 1; transform: translateX(0); }
        .toast--leave { opacity: 0; transform: translateX(20px); }
        .toast--error   { border-color: rgba(255, 0, 0, 0.6); color: #ff8a8a; }
        .toast--warning { border-color: rgba(255, 229, 0, 0.6); color: #ffe899; }
        .toast--success { border-color: rgba(0, 214, 20, 0.6); color: #8af0a3; }
        /* Móvil: toasts a ancho completo (right:16px + max-width:360px se desborda en 360px). */
        @media (max-width: 480px) {
            .toast-container {
                top: auto;
                bottom: 16px;
                left: 12px;
                right: 12px;
                max-width: none;
            }
            .toast { transform: translateY(20px); }
            .toast--enter { transform: translateY(0); }
            .toast--leave { transform: translateY(20px); }
        }
    </style>
</head>
<body>
    <!-- Splash de arranque: tapa el header a medio pintar + "Redirigiendo..." +
         fondo dinámico sin cargar durante el boot frío. Se descarta solo cuando
         la app aterriza en una vista real (no en una de redirección). -->
    <div id="app-splash" role="status" aria-live="polite" aria-label="Cargando AI Smart Content">
      <canvas class="app-splash-rays" aria-hidden="true"></canvas>
      <img src="/recursos/logos/logo-03.svg" alt="AI Smart Content" class="app-splash-logo" width="280" height="29">
    </div>
    <script>
      // Rayos del splash: trazos de luz refractada que caen en camara lenta hacia
      // el centro. Misma fisica que js/ui/Starfield.js (tiron que crece al
      // acercarse, exponente 0.6, leve giro) pero con TRAZOS orientados al punto
      // de fuga: cada rayo es una franja del espectro (azul en la punta que mira
      // al centro, naranja en la cola), largo y grueso segun la distancia, asi
      // la perspectiva sale sola. Inline porque debe animar desde la primera
      // pintura, antes de cualquier bundle.
      (function () {
        var splash = document.getElementById('app-splash');
        var canvas = splash && splash.querySelector('.app-splash-rays');
        if (!canvas || !canvas.getContext) return;
        var ctx = canvas.getContext('2d');
        var rays = [], raf = null, last = 0, cx = 0, cy = 0, spawnR = 0, w = 0, h = 0;
        var reduced = false;
        try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (_) {}

        function spawn(frac) {
          return {
            r: spawnR * (frac != null ? frac : 1 + Math.random() * 0.2),
            ang: Math.random() * Math.PI * 2,
            vel: 14 + Math.random() * 22,            // camara lenta
            giro: (Math.random() < 0.5 ? -1 : 1) * (0.006 + Math.random() * 0.018),
            len: 0.22 + Math.random() * 0.38,          // largo relativo a la distancia
            grosor: 2.4 + Math.random() * 4.2,
            brillo: 0.55 + Math.random() * 0.45
          };
        }
        function resize() {
          w = window.innerWidth; h = window.innerHeight;
          var dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          cx = w / 2; cy = h / 2;
          spawnR = Math.hypot(w, h) / 2 * 1.05;
          var total = Math.max(26, Math.min(64, Math.round(w * h / 26000)));
          while (rays.length > total) rays.pop();
          while (rays.length < total) rays.push(spawn(0.25 + Math.random() * 0.85));
        }
        function step(dt) {
          for (var i = 0; i < rays.length; i++) {
            var p = rays[i];
            var f = Math.pow(spawnR / Math.max(p.r, 90), 0.6);
            p.r -= p.vel * f * dt;
            p.ang += p.giro * f * dt;
            if (p.r <= 40) rays[i] = spawn();
          }
        }
        function draw() {
          ctx.clearRect(0, 0, w, h);
          ctx.globalCompositeOperation = 'lighter';
          ctx.lineCap = 'round';
          var entrada = spawnR * 0.9, salida = 200;
          for (var i = 0; i < rays.length; i++) {
            var p = rays[i];
            var a = p.brillo;
            if (p.r > entrada) a *= Math.max(0, (spawnR * 1.2 - p.r) / (spawnR * 1.2 - entrada));
            if (p.r < salida) a *= Math.max(0, (p.r - 40) / (salida - 40));
            if (a <= 0.01) continue;
            var k = p.r / spawnR;                      // 0 en el centro, 1 en el borde
            var L = p.r * p.len;
            var cos = Math.cos(p.ang), sin = Math.sin(p.ang);
            var x1 = cx + cos * p.r, y1 = cy + sin * p.r;
            var x2 = cx + cos * (p.r + L), y2 = cy + sin * (p.r + L);
            var g = ctx.createLinearGradient(x1, y1, x2, y2);
            g.addColorStop(0,    'rgba(91,0,234,0)');
            g.addColorStop(0.14, 'rgba(0,24,238,' + a + ')');
            g.addColorStop(0.36, 'rgba(0,231,255,' + a + ')');
            g.addColorStop(0.52, 'rgba(255,248,228,' + a + ')');
            g.addColorStop(0.7,  'rgba(255,229,0,' + a + ')');
            g.addColorStop(0.88, 'rgba(255,101,0,' + a * 0.9 + ')');
            g.addColorStop(1,    'rgba(255,40,0,0)');
            var ancho = p.grosor * (0.3 + k * 0.9);
            ctx.strokeStyle = g;
            // halo: el mismo trazo ancho y tenue = el desenfoque de la foto
            ctx.globalAlpha = 0.3; ctx.lineWidth = ancho * 3.2;
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
            // nucleo
            ctx.globalAlpha = 1; ctx.lineWidth = ancho;
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
          }
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = 'source-over';
        }
        function frame(now) {
          var dt = Math.min((now - last) / 1000, 0.05);
          last = now; step(dt); draw();
          raf = requestAnimationFrame(frame);
        }
        function onResize() { resize(); if (reduced) draw(); }
        resize();
        window.addEventListener('resize', onResize);
        if (reduced) { draw(); }
        else { last = performance.now(); raf = requestAnimationFrame(frame); }
        // El descarte del splash la apaga: sin esto el rAF seguiria vivo.
        window.__appSplashRaysStop = function () {
          if (raf) cancelAnimationFrame(raf);
          raf = null;
          window.removeEventListener('resize', onResize);
        };
      })();
    </script>
    <script>
      // Descarte del splash. El router emite 'routechange' al terminar de pintar
      // cada vista, incluida la cadena de redirección de arranque
      // ('/' -> '/home' -> '/org/.../dashboard'). Mantenemos el splash sobre las
      // vistas de redirección y lo quitamos al llegar a la primera vista real.
      (function () {
        var REDIRECT_PATHS = { '/': 1, '/home': 1, '/hogar': 1 };
        var splash = document.getElementById('app-splash');
        if (!splash) return;
        var done = false;
        function dismiss() {
          if (done) return;
          done = true;
          window.removeEventListener('routechange', onRoute);
          splash.classList.add('app-splash--hide');
          var remove = function () {
            if (window.__appSplashRaysStop) window.__appSplashRaysStop();
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          };
          splash.addEventListener('transitionend', remove, { once: true });
          // Failsafe por si transitionend no dispara (tab en background, etc.).
          setTimeout(remove, 800);
        }
        function onRoute(e) {
          var p = (e && e.detail && e.detail.path) || window.location.pathname || '/';
          if (p.length > 1 && p.charAt(p.length - 1) === '/') p = p.slice(0, -1);
          if (!REDIRECT_PATHS[p]) dismiss();
        }
        // Exponer para que el bootstrap lo llame si pinta una pantalla de error.
        window.__appSplashDismiss = dismiss;
        window.addEventListener('routechange', onRoute);
        // Failsafe absoluto: nunca dejar al usuario atrapado tras el splash.
        setTimeout(dismiss, 10000);
      })();
    </script>

        <h1 style="font-size: 1.25rem; margin: 0 0 12px;">AI Smart Content requiere JavaScript</h1>
        <p style="margin: 0 0 8px;">Esta aplicación es una experiencia interactiva que necesita JavaScript habilitado para funcionar.</p>
        <p style="margin: 0; font-size: 0.875rem; color: rgba(212, 209, 216, 0.6);">Activa JavaScript en tu navegador y recarga la página.</p>
      </div>

    <!-- Skip link: keyboard/screen-reader users pueden saltarse el sidebar

        <div class="loader">
            <div class="loader-line"></div>
        </div>
    </div>

    <!-- Navigation Container (Persistente) -->

    <!-- App Container (Dinámico) -->
    <!-- Las vistas se cargarán aquí dinámicamente.
         role="main" marca esto como el landmark principal para screen
         readers (las vistas no necesitan agregar otro <main> dentro).
         tabindex="-1" permite que el skip-link mueva el foco aquí sin
         que el contenedor sea tabbable en navegación normal. -->
    <div id="app-container" role="main" aria-label="Contenido principal" tabindex="-1"></div>


    <!-- Portal de modales: fuera del scroll, centrados en pantalla -->

    <!-- External Scripts.
         Chart.js no se carga aquí; otras vistas lo cargan bajo demanda si lo necesitan.
         Supabase JS SDK usa `defer` para no bloquear la primera pintura del hero.
         Versión pinneada + SRI: sin pin, jsdelivr resuelve `@2` a la última minor y el
         SRI rompería en cada release. Con hash fijo, si el CDN sirve bytes distintos el
         navegador rechaza el script (mitiga un compromiso de la supply-chain). -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.103.2" defer
            integrity="sha384-clqYxV1hjoC1RwoBT11M16mn2I42U4CCZc2QcnjigG/l1lFSxC/zBRAoMxhlrK1Z"
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- URL base del ai-engine (opcional). Ver js/runtime-config.js -->
    <script src="js/runtime-config.js?v=__BUILD_ID__" defer></script>

    <!-- i18n: catalogos + servicio (window.i18n / window.t). DEBE ir antes de
         BaseView y de cualquier vista, porque los templates usan ${t('...')}.
         Cada idioma extra = un <script> de catalogo mas + su codigo en SUPPORTED. -->
    <script src="js/i18n/en.js?v=__BUILD_ID__" defer></script>
    <script src="js/services/I18n.js?v=__BUILD_ID__" defer></script>

    <!-- Core: app-loader (Supabase config + spinner global) — rutas relativas a <base href="/"> -->
    <script src="js/app-loader.js?v=__BUILD_ID__" defer></script>
    <!-- ErrorLogger temprano para capturar crashes del bootstrap (window.error + unhandledrejection).
         No depende de Supabase: si aún no está disponible, buffea en LS y flushea cuando llegue. -->
    <script src="js/services/ErrorLogger.js?v=__BUILD_ID__" defer></script>
    <!-- ErrorHandler: define window.errorHandler (toast + estado de error con retry).
         BaseView.render y router.js lo invocan tras un guard `if` que antes nunca pasaba. -->
    <script src="js/services/ErrorHandler.js?v=__BUILD_ID__" defer></script>
    <!-- PageMeta: título dinámico "{Org} | {Section}". Debe ir ANTES de router.js
         para registrar el listener `routechange` antes del primer dispatch. -->
    <script src="js/utils/PageMeta.js?v=__BUILD_ID__" defer></script>
    <script src="js/views/BaseView.js?v=__BUILD_ID__" defer></script>
    <script src="js/ui/transiciones.js?v=__BUILD_ID__" defer></script>
    <script src="js/router.js?v=__BUILD_ID__" defer></script>

    <!-- Modal primitiva compartida (window.Modal.show) -->
    <script src="js/utils/modal.js?v=__BUILD_ID__" defer></script>

    <!-- Prefetch de top-5 vistas en idle time. Si el browser tiene cycles
         libres tras el LCP, descarga estos JS en background con baja
         prioridad. La primera navegación a Dashboard/Studio/Production/
         Brand Storage/Tasks se siente "instant" porque el script ya
         está cacheado. Cero coste si idle nunca llega (low-end devices). -->
    <script>
      (function() {
        // Corte (ADR-0052): las vistas más usadas de la consola nueva (el Tablero es TableroView;
        // DashboardView/BrandstorageView/TasksView ya no tienen ruta o están en obras).
        var topViews = [
          'js/views/TableroView.js',
          'js/views/ImageView.js',
          'js/views/VeraView.js',
          'js/views/ProductionView.js',
          'js/views/StudioView.js'
        ];
        function injectPrefetch() {
          topViews.forEach(function(src) {
            var link = document.createElement('link');
            link.rel = 'prefetch';
            link.as = 'script';
            link.href = src;
            document.head.appendChild(link);
          });
        }
        if ('requestIdleCallback' in window) {
          requestIdleCallback(injectPrefetch, { timeout: 4000 });
        } else {
          setTimeout(injectPrefetch, 2000);
        }
      })();
    </script>
